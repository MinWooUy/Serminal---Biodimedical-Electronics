# Ablation A4 (full): 6 RR features (+ rr_prev/rr_next, rr_prev/rr_avg32) on the current base (ce, sqrt_inverse).
# Head 518 -> 256 -> 4. 20 epochs, OOF snapshots 3/5/8/12/16/20;
# best snapshot vs base (Full @8 / Lite @12, 4 RR features), paired by seed.
name: A4_rr6_full
dataset: DS1
beats_config: configs/beats_rr6.yaml
model:
  channels:
  - 64
  - 128
  - 256
  - 512
  kernels:
  - 7
  - 5
  - 3
  - 3
  hidden: 256
  dropout_conv: 0.2
  dropout_head: 0.5
  n_rr: 6
train:
  batch_size: 256
  max_epochs: 20
  lr: 0.001
  weight_decay: 0.01
  class_weight: sqrt_inverse
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs:
  - 3
  - 5
  - 8
  - 12
  - 16
  - 20
  augment: false
seeds:
- 42
- 43
- 44
folds:
- 0
- 1
- 2
- 3
- 4
