# Ablation A2 (lite): CE without class weights.
# Same as A1 (fixed epochs, 12 epochs, LR plateau on inner-val loss, OOF snapshots 3/5/8/12);
# each variant takes its best snapshot, then paired-by-seed vs the base (Full 8 / Lite 5 epochs of A1).
# Loss and epoch are both chosen on OOF -> optimistic; DS2 is the clean measurement.
name: A2_ce_none_lite
dataset: DS1
beats_config: configs/beats.yaml
model:
  channels:
  - 16
  - 32
  - 64
  - 64
  kernels:
  - 7
  - 5
  - 3
  - 3
  hidden: 32
  dropout_conv: 0.2
  dropout_head: 0.5
train:
  batch_size: 256
  max_epochs: 12
  lr: 0.001
  weight_decay: 0.01
  class_weight: none
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs:
  - 3
  - 5
  - 8
  - 12
  loss: ce
  focal_gamma: 2.0
seeds:
- 42
- 43
- 44
folds:
- 0
- 1
- 2
- 3
- 4
