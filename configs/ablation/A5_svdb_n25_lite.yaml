# Ablation A5 (lite): base Lite (focal(2) + sqrt_inverse, 4 RR) + SVDB all S/V/F + 25% N (fixed sample seed 0) in INNER-TRAIN only.
# Inner-val and outer folds are 100% MIT-BIH; class weights and RR mu/sigma on the combined inner-train.
# 20 epochs, OOF snapshots 3/5/8/12/16/20; best snapshot vs Lite base @12, paired by seed.
name: A5_svdb_n25_lite
dataset: DS1
beats_config: configs/beats.yaml
model:
  channels:
  - 16
  - 32
  - 64
  - 64
  kernels:
  - 7
  - 5
  - 3
  - 3
  hidden: 32
  dropout_conv: 0.2
  dropout_head: 0.5
train:
  batch_size: 256
  max_epochs: 20
  lr: 0.001
  weight_decay: 0.01
  class_weight: sqrt_inverse
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs:
  - 3
  - 5
  - 8
  - 12
  - 16
  - 20
  loss: focal
  focal_gamma: 2.0
seeds:
- 42
- 43
- 44
folds:
- 0
- 1
- 2
- 3
- 4
extra_train:
  source: svdb
  variant: n25
  sample_seed: 0
