# Ablation A1 (lite): fixed number of epochs. Same as A0 (configs/cnn_lite.yaml) except: no early stopping,
# train exactly 12 epochs (LR plateau on inner-val loss kept, same trajectory as A0) and store OOF predictions
# after 3, 5, 8 and 12 epochs. Chosen by pooled-OOF macro-F1 -> CV hyper-parameter selection (optimistic).
name: A1_epochs_lite
dataset: DS1
beats_config: configs/beats.yaml        # R source = detector (default)
model:
  channels: [16, 32, 64, 64]
  kernels: [7, 5, 3, 3]
  hidden: 32                            # head 68 -> 32 -> 4
  dropout_conv: 0.2
  dropout_head: 0.5
train:
  batch_size: 256
  max_epochs: 12
  lr: 1.0e-3
  weight_decay: 1.0e-2
  class_weight: sqrt_inverse
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs: [3, 5, 8, 12]
seeds: [42, 43, 44]
folds: [0, 1, 2, 3, 4]
