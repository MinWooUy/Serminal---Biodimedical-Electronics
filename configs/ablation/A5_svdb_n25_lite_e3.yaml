# Re-run of the frozen Lite base (A5 SVDB n25) for exactly 3 epochs to keep the epoch-3 weights
# (the A5 run only stored epoch-20 checkpoints). Same trajectory: the LR plateau cannot trigger before epoch 4,
# so epoch-3 weights must reproduce the saved A5 @3 OOF predictions.
name: A5_svdb_n25_lite_e3
dataset: DS1
beats_config: configs/beats.yaml
model:
  channels:
  - 16
  - 32
  - 64
  - 64
  kernels:
  - 7
  - 5
  - 3
  - 3
  hidden: 32
  dropout_conv: 0.2
  dropout_head: 0.5
train:
  batch_size: 256
  max_epochs: 3
  lr: 0.001
  weight_decay: 0.01
  class_weight: sqrt_inverse
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs:
  - 3
  loss: focal
  focal_gamma: 2.0
seeds:
- 42
- 43
- 44
folds:
- 0
- 1
- 2
- 3
- 4
extra_train:
  source: svdb
  variant: n25
  sample_seed: 0
