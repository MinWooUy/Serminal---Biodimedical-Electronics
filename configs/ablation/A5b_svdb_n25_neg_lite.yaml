# Ablation A5b (lite): A5 winner (SVDB n25, rule A) + the 18 records excluded by rule A, on their
# negative-QRS channel when it reaches Se and +P >= 97% (all 18 do), sampled separately (S/V/F + 25% N, seed 0).
# Inner-train only. 20 epochs, OOF snapshots 3/5/8/12/16/20; best snapshot vs A5 n25 @3, paired by seed.
name: A5b_svdb_n25_neg_lite
dataset: DS1
beats_config: configs/beats.yaml
model:
  channels:
  - 16
  - 32
  - 64
  - 64
  kernels:
  - 7
  - 5
  - 3
  - 3
  hidden: 32
  dropout_conv: 0.2
  dropout_head: 0.5
train:
  batch_size: 256
  max_epochs: 20
  lr: 0.001
  weight_decay: 0.01
  class_weight: sqrt_inverse
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 6
  inner_val_frac: 0.2
  inner_buffer_s: 1.0
  early_stopping: false
  snapshot_epochs:
  - 3
  - 5
  - 8
  - 12
  - 16
  - 20
  loss: focal
  focal_gamma: 2.0
seeds:
- 42
- 43
- 44
folds:
- 0
- 1
- 2
- 3
- 4
extra_train:
  source: svdb
  variant: n25
  sample_seed: 0
  negative_fallback: true
